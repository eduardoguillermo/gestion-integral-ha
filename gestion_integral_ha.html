<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gestión Integral de HA</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00838f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap">
</head>
<body>

<div class="main">
  <div class="topbar">
    <div class="logo">
      <div class="logo-icon">🏠</div>
      <div>
        <div class="logo-text">Gestión Integral de HA</div>
        <div class="logo-sub">Sensores y baterías · <span id="topbar-version"></span></div>
      </div>
    </div>
    <div class="pacts">
      <button class="btn" id="btnHelp" title="Ayuda">❓</button>
      <button class="btn" id="btnDrive" title="Conectar Google Drive">🔌</button>
      <button class="btn" id="btnBackup" title="Backup ahora">☁️</button>
      <button class="btn" id="btnExit" title="Salir">🚪</button>
    </div>
  </div>

  <div class="content">
    <div class="stats" id="stats"></div>

    <div class="sbar">
      <input type="text" id="search" autocomplete="off" placeholder="Buscar por nombre o entidad">
      <select id="filtroTipoSel"></select>
      <button class="btn btn-p" id="btnAgregar">+ Agregar dispositivo</button>
    </div>

    <div class="dev-grid" id="list"></div>
  </div>
</div>

<div class="moverlay" id="modal" style="display:none" onclick="if(event.target===this) cerrarModal()">
  <div class="modal">
    <div class="mhead">
      <h3 id="modal-title"></h3>
      <button class="btn btn-sm" onclick="cerrarModal()">✕</button>
    </div>
    <div class="mbody" id="modal-body"></div>
    <div class="mfoot" id="modal-foot"></div>
  </div>
</div>

<div id="toast">
  <span id="toastMsg"></span>
  <button id="toastUndo">Deshacer</button>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="app.js"></script>
</body>
</html>
