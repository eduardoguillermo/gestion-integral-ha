<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gestión Integral de HA</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00838f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap">
</head>
<body>

<nav class="nav" id="nav">
  <div class="nav-logo">
    <div class="logo-icon">🏠</div>
    <div>
      <div class="logo-text">Gestión Integral de HA</div>
      <div class="logo-sub">Home Assistant · <span id="nav-version"></span></div>
    </div>
  </div>
  <div class="nav-section">
    <div class="nav-section-title">Principal</div>
    <a onclick="goTo('inventario')" id="nav-inventario">📦 Inventario</a>
    <a onclick="goTo('reportes')" id="nav-reportes">📈 Reportes</a>
  </div>
  <div class="nav-section">
    <div class="nav-section-title">Sistema</div>
    <a onclick="goTo('backup')" id="nav-backup">💾 Backup</a>
  </div>
</nav>

<div class="nav-overlay" id="nav-overlay" onclick="toggleNav()"></div>

<div class="main">
  <div class="topbar">
    <button class="nav-toggle" id="nav-toggle" onclick="toggleNav()">&#9776;</button>
    <div class="ptitle" id="ptitle">Inventario</div>
    <div class="pacts" id="pacts"></div>
    <button class="btn btn-sm" id="btnHelp" title="Ayuda">❓ Ayuda</button>
    <button class="btn btn-sm" id="btnExit" title="Salir">🚪 Salir</button>
  </div>
  <div class="content" id="content"></div>
</div>

<div class="moverlay" id="modal" style="display:none" onclick="if(event.target===this) cerrarModal()">
  <div class="modal">
    <div class="mhead">
      <h3 id="modal-title"></h3>
      <button class="btn btn-sm" onclick="cerrarModal()">✕</button>
    </div>
    <div class="mbody" id="modal-body"></div>
    <div class="mfoot" id="modal-foot"></div>
  </div>
</div>

<div id="toast">
  <span id="toastMsg"></span>
  <button id="toastUndo">Deshacer</button>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="app.js"></script>
</body>
</html>
